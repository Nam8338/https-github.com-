<!-- Thanh trạng thái người chơi & Bảng xếp hạng -->
<div class="user-strip" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:8px 16px;margin-bottom:12px;">
  <div style="display:flex;align-items:center;gap:8px;">
    <span id="authAvatar" style="font-size:22px;">👤</span>
    <span id="authGreeting" style="font-weight:700;">Đang chơi với tư cách Khách</span>
    <button class="btn alt" id="authActionBtn" style="padding:4px 12px;font-size:14px;">Đăng nhập / Đăng ký</button>
  </div>
  <button class="btn alt" id="openRankBtn" style="padding:4px 14px;font-size:14px;font-weight:800;">🏆 Bảng xếp hạng</button>
</div>

<!-- Modal Đăng nhập / Đăng ký & Bảng xếp hạng -->
<dialog id="authModal" style="border:3px solid var(--line);border-radius:24px;padding:24px;background:var(--card);color:var(--ink);max-width:420px;width:92%;box-shadow:0 12px 30px rgba(0,0,0,0.25);">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <h3 id="modalTitle" style="font-size:24px;margin:0;">Đăng nhập</h3>
    <button id="closeModalBtn" style="border:none;background:none;font-size:22px;cursor:pointer;line-height:1;">✕</button>
  </div>

  <div id="authBox">
    <div style="display:flex;gap:6px;margin-bottom:16px;background:var(--cream);padding:4px;border-radius:14px;border:2px solid var(--line);">
      <button id="tabLogin" class="btn" style="flex:1;padding:6px;font-size:15px;">Đăng nhập</button>
      <button id="tabSignup" class="btn alt" style="flex:1;padding:6px;font-size:15px;border:none;">Đăng ký</button>
    </div>

    <div id="signupFields" hidden>
      <label style="font-size:14px;font-weight:700;display:block;margin-bottom:4px;">Tên người chơi</label>
      <input type="text" id="iptUsername" placeholder="Ví dụ: Minh_Eco" style="width:100%;border-radius:14px;border:2px solid var(--line);background:var(--cream);padding:10px 12px;margin-bottom:10px;">
    </div>

    <label style="font-size:14px;font-weight:700;display:block;margin-bottom:4px;">Email</label>
    <input type="email" id="iptEmail" placeholder="player@example.com" style="width:100%;border-radius:14px;border:2px solid var(--line);background:var(--cream);padding:10px 12px;margin-bottom:10px;">

    <label style="font-size:14px;font-weight:700;display:block;margin-bottom:4px;">Mật khẩu</label>
    <input type="password" id="iptPassword" placeholder="Tối thiểu 6 ký tự" style="width:100%;border-radius:14px;border:2px solid var(--line);background:var(--cream);padding:10px 12px;margin-bottom:16px;">

    <button class="btn" id="btnSubmitAuth" style="width:100%;padding:12px;font-size:16px;">Đăng nhập</button>
    <p id="authMsg" class="note" style="margin-top:10px;text-align:center;" aria-live="polite"></p>
  </div>

  <div id="rankBox" hidden>
    <div style="max-height:280px;overflow-y:auto;padding-right:6px;">
      <ul id="rankList" style="list-style:none;padding:0;margin:0;display:grid;gap:8px;"></ul>
    </div>
  </div>
</dialog>
